; P09 StateHandoff - input configuration.
; Only the two keys Epic's 5.8 TP_Blank template sets (Templates/TP_Blank/Config/DefaultInput.ini:79-80). BaseInput.ini
; doesn't set them, so the engine would create the classic UPlayerInput, and the Enhanced Input plugin (enabled by
; default) would warn at startup that its local-player subsystem has "no valid PlayerInput object"
; (EnhancedInputSubsystems.cpp:118). The project reads no player input.

[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
