<svg xmlns="http://www.w3.org/2000/svg" width="640" height="308" viewBox="0 0 640 308" role="img" aria-label="Divergence incidents per 1,000 representation transitions">
<style>.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.grid{stroke:#e4e3df}.bar{fill:#2a78d6}@media (prefers-color-scheme: dark){.bg{fill:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.grid{stroke:#3a3936}.bar{fill:#3987e5}}text{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif}</style>
